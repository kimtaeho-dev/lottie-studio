<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Lottie Studio 준비</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0b0c; color: #e8e8ea;
    font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  main { width: 440px; padding: 0 32px; }
  h1 { font-size: 19px; margin: 0 0 10px; letter-spacing: -0.01em; }
  p { margin: 0 0 22px; color: #a1a1a6; }
  button {
    width: 100%; padding: 11px 16px; border: 0; border-radius: 9px;
    background: #f5f5f7; color: #0b0b0c; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button:disabled { background: #2a2a2d; color: #7a7a80; cursor: default; }
  .log {
    margin-top: 18px; max-height: 132px; overflow-y: auto;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: #6f6f76;
    white-space: pre-wrap; word-break: break-all;
  }
  .error { color: #ff6b6b; margin-top: 14px; }
  input {
    width: 100%; padding: 11px 14px; margin-bottom: 10px;
    border: 1px solid #2f2f33; border-radius: 9px;
    background: #151517; color: #e8e8ea; font-size: 14px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #5b5b62; }
  .link {
    display: block; margin-bottom: 16px; color: #7aa2ff; font-size: 12px;
    word-break: break-all; cursor: pointer; text-decoration: underline;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">준비하는 중…</h1>
  <p id="body">잠시만 기다려 주세요.</p>
  <a id="link" class="link hidden"></a>
  <input id="code" class="hidden" placeholder="브라우저에서 받은 코드를 붙여넣으세요" />
  <button id="action" class="hidden"></button>
  <div id="log" class="log"></div>
  <div id="error" class="error hidden"></div>
</main>
<script>
  const el = (id) => document.getElementById(id);
  const setText = (id, text) => { el(id).textContent = text; };
  const show = (id, visible) => el(id).classList.toggle("hidden", !visible);

  let pollTimer = null;

  window.setup.onProgress((line) => {
    const log = el("log");
    log.textContent += (log.textContent ? "\n" : "") + line;
    log.scrollTop = log.scrollHeight;
  });

  function fail(message) {
    setText("error", message);
    show("error", true);
  }

  async function refresh() {
    const status = await window.setup.status();

    if (status.ready) {
      if (pollTimer) clearInterval(pollTimer);
      setText("title", "준비 끝났습니다");
      setText("body", "스튜디오를 여는 중…");
      show("action", false);
      await window.setup.finish();
      return;
    }

    if (!status.claude) {
      setText("title", "한 가지만 설치하면 됩니다");
      setText("body",
        "애니메이션을 만들어 줄 에이전트가 아직 이 컴퓨터에 없습니다. " +
        "아래 버튼을 누르면 알아서 설치합니다. 몇 분 걸릴 수 있어요.");
      el("action").textContent = "설치 시작";
      el("action").disabled = false;
      show("action", true);
      el("action").onclick = async () => {
        el("action").disabled = true;
        el("action").textContent = "설치하는 중…";
        show("error", false);
        const result = await window.setup.install();
        if (result.ok) {
          await refresh();
        } else {
          fail("설치에 실패했습니다: " + result.error);
          el("action").disabled = false;
          el("action").textContent = "다시 시도";
        }
      };
      return;
    }

    // Installed but not signed in. `claude auth login` opens the browser and
    // waits on stdin for the code it hands back, so the whole exchange happens
    // in this window.
    setText("title", "로그인만 하면 됩니다");
    setText("body", "버튼을 누르면 브라우저가 열립니다. 로그인한 뒤 받은 코드를 여기에 붙여넣어 주세요.");
    el("action").textContent = "로그인 시작";
    el("action").disabled = false;
    show("action", true);
    el("action").onclick = startLogin;
  }

  async function startLogin() {
    el("action").disabled = true;
    el("action").textContent = "브라우저를 여는 중…";
    show("error", false);

    const result = await window.setup.startLogin();
    if (!result.ok) {
      fail(result.error || "로그인을 시작하지 못했습니다.");
      el("action").disabled = false;
      el("action").textContent = "다시 시도";
      return;
    }

    setText("body", "브라우저에서 로그인한 뒤, 화면에 나오는 코드를 아래에 붙여넣어 주세요.");
    const link = el("link");
    link.textContent = "브라우저가 안 열렸다면 여기를 누르세요";
    link.onclick = () => window.setup.openUrl(result.url);
    show("link", true);
    show("code", true);
    el("code").focus();

    el("action").textContent = "확인";
    el("action").disabled = false;
    el("action").onclick = submitCode;
    el("code").onkeydown = (e) => { if (e.key === "Enter") submitCode(); };
  }

  async function submitCode() {
    const code = el("code").value.trim();
    if (!code) return;
    el("action").disabled = true;
    el("action").textContent = "확인하는 중…";
    show("error", false);

    const result = await window.setup.submitCode(code);
    if (!result.ok) {
      fail(result.error || "코드를 전달하지 못했습니다.");
      el("action").disabled = false;
      el("action").textContent = "다시 시도";
      el("action").onclick = startLogin;
      return;
    }
    // The CLI stores credentials on its own schedule; poll until it reports in.
    if (!pollTimer) pollTimer = setInterval(refresh, 2000);
  }

  refresh().catch((err) => fail(String(err?.message ?? err)));
</script>
</body>
</html>
